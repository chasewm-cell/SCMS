<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Clock - Multiple Time Zones</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Courier New', monospace;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 40px;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.37);
            border: 1px solid rgba(255, 255, 255, 0.18);
            max-width: 900px;
        }

        .title {
            text-align: center;
            color: white;
            font-size: 2.5em;
            margin-bottom: 40px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        }

        .clocks-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .clock {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            text-align: center;
            transition: transform 0.3s ease;
        }

        .clock:hover {
            transform: translateY(-5px);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
        }

        .timezone-name {
            font-size: 1.1em;
            color: #667eea;
            font-weight: bold;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .time {
            font-size: 2.2em;
            color: #333;
            font-weight: bold;
            font-family: 'Courier New', monospace;
            letter-spacing: 2px;
            margin-bottom: 8px;
        }

        .date {
            font-size: 0.9em;
            color: #666;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .ampm {
            font-size: 0.8em;
            color: #999;
            margin-top: 5px;
        }

        .controls {
            display: flex;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 30px;
            padding-top: 30px;
            border-top: 2px solid rgba(255, 255, 255, 0.2);
        }

        button {
            background: rgba(255, 255, 255, 0.2);
            color: white;
            border: 2px solid white;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1em;
            transition: all 0.3s ease;
            font-weight: bold;
        }

        button:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: scale(1.05);
        }

        button:active {
            transform: scale(0.95);
        }

        .add-timezone {
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
            margin-top: 15px;
        }

        .add-timezone select {
            padding: 8px 12px;
            border-radius: 8px;
            border: 2px solid white;
            background: rgba(255, 255, 255, 0.2);
            color: white;
            font-size: 0.95em;
            cursor: pointer;
        }

        .add-timezone select option {
            color: #333;
            background: white;
        }

        .add-timezone select::placeholder {
            color: rgba(255, 255, 255, 0.7);
        }

        @media (max-width: 600px) {
            .container {
                padding: 20px;
            }

            .title {
                font-size: 1.8em;
                margin-bottom: 25px;
            }

            .clocks-grid {
                grid-template-columns: 1fr;
                gap: 15px;
            }

            .time {
                font-size: 1.8em;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="title">🌍 World Clock</h1>
        <div class="clocks-grid" id="clocksContainer"></div>
        
        <div class="controls">
            <button onclick="resetToDefault()">Reset to Default</button>
            <button onclick="toggleFormat()">Toggle 24-Hour Format</button>
        </div>

        <div class="add-timezone">
            <select id="timezoneSelect" onchange="addTimezone()">
                <option value="">+ Add Timezone</option>
            </select>
        </div>
    </div>

    <script>
        // Default timezones
        const defaultTimezones = [
            { name: 'New York', timezone: 'America/New_York' },
            { name: 'London', timezone: 'Europe/London' },
            { name: 'Tokyo', timezone: 'Asia/Tokyo' },
            { name: 'Sydney', timezone: 'Australia/Sydney' }
        ];

        let timezones = [...defaultTimezones];
        let use24HourFormat = false;

        // All available timezones
        const allTimezones = [
            { name: 'New York', timezone: 'America/New_York' },
            { name: 'Los Angeles', timezone: 'America/Los_Angeles' },
            { name: 'Chicago', timezone: 'America/Chicago' },
            { name: 'Denver', timezone: 'America/Denver' },
            { name: 'London', timezone: 'Europe/London' },
            { name: 'Paris', timezone: 'Europe/Paris' },
            { name: 'Berlin', timezone: 'Europe/Berlin' },
            { name: 'Dubai', timezone: 'Asia/Dubai' },
            { name: 'India', timezone: 'Asia/Kolkata' },
            { name: 'Bangkok', timezone: 'Asia/Bangkok' },
            { name: 'Hong Kong', timezone: 'Asia/Hong_Kong' },
            { name: 'Shanghai', timezone: 'Asia/Shanghai' },
            { name: 'Tokyo', timezone: 'Asia/Tokyo' },
            { name: 'Sydney', timezone: 'Australia/Sydney' },
            { name: 'Auckland', timezone: 'Pacific/Auckland' },
            { name: 'Honolulu', timezone: 'Pacific/Honolulu' },
            { name: 'São Paulo', timezone: 'America/Sao_Paulo' },
            { name: 'Mexico City', timezone: 'America/Mexico_City' },
            { name: 'Moscow', timezone: 'Europe/Moscow' },
            { name: 'Istanbul', timezone: 'Europe/Istanbul' },
            { name: 'Cairo', timezone: 'Africa/Cairo' },
            { name: 'South Africa', timezone: 'Africa/Johannesburg' },
            { name: 'Singapore', timezone: 'Asia/Singapore' },
            { name: 'Jakarta', timezone: 'Asia/Jakarta' }
        ];

        function getClockHTML(tz) {
            return `<div class="clock" data-timezone="${tz.timezone}">
                <div class="timezone-name">${tz.name}</div>
                <div class="time" id="time-${tz.timezone}">--:--:--</div>
                <div class="date" id="date-${tz.timezone}">---------</div>
                <div class="ampm" id="ampm-${tz.timezone}"></div>
                <button onclick="removeTimezone('${tz.timezone}')" style="margin-top: 10px; padding: 5px 10px; font-size: 0.8em;">Remove</button>
            </div>`;
        }

        function updateClocks() {
            timezones.forEach(tz => {
                const now = new Date();
                const formatter = new Intl.DateTimeFormat('en-US', {
                    timeZone: tz.timezone,
                    hour: '2-digit',
                    minute: '2-digit',
                    second: '2-digit',
                    hour12: !use24HourFormat
                });

                const dateFormatter = new Intl.DateTimeFormat('en-US', {
                    timeZone: tz.timezone,
                    year: 'numeric',
                    month: 'short',
                    day: 'numeric',
                    weekday: 'short'
                });

                const timeParts = formatter.formatToParts(now);
                let timeString = timeParts
                    .filter(p => p.type !== 'literal')
                    .map(p => p.value)
                    .join(':');

                // Handle 24-hour format
                if (use24HourFormat) {
                    const utcTime = new Date(now.toLocaleString('en-US', { timeZone: tz.timezone }));
                    const hours = String(utcTime.getHours()).padStart(2, '0');
                    const minutes = String(utcTime.getMinutes()).padStart(2, '0');
                    const seconds = String(utcTime.getSeconds()).padStart(2, '0');
                    timeString = `${hours}:${minutes}:${seconds}`;
                }

                const dateString = dateFormatter.format(now);

                const timeElement = document.getElementById(`time-${tz.timezone}`);
                const dateElement = document.getElementById(`date-${tz.timezone}`);
                const ampmElement = document.getElementById(`ampm-${tz.timezone}`);

                if (timeElement) timeElement.textContent = timeString;
                if (dateElement) dateElement.textContent = dateString;
                
                if (ampmElement) {
                    const ampm = timeParts.find(p => p.type === 'dayPeriod');
                    ampmElement.textContent = ampm ? ampm.value : '';
                }
            });
        }

        function renderClocks() {
            const container = document.getElementById('clocksContainer');
            container.innerHTML = timezones.map(tz => getClockHTML(tz)).join('');
            updateClocks();
        }

        function removeTimezone(timezone) {
            timezones = timezones.filter(tz => tz.timezone !== timezone);
            renderClocks();
        }

        function addTimezone() {
            const select = document.getElementById('timezoneSelect');
            const selectedValue = select.value;

            if (selectedValue) {
                const selected = allTimezones.find(tz => tz.timezone === selectedValue);
                if (selected && !timezones.find(tz => tz.timezone === selectedValue)) {
                    timezones.push(selected);
                    renderClocks();
                }
            }
            select.value = '';
        }

        function resetToDefault() {
            timezones = [...defaultTimezones];
            renderClocks();
        }

        function toggleFormat() {
            use24HourFormat = !use24HourFormat;
            updateClocks();
        }

        // Populate timezone select
        function populateTimezoneSelect() {
            const select = document.getElementById('timezoneSelect');
            const currentTimezones = timezones.map(tz => tz.timezone);
            const availableTimezones = allTimezones.filter(tz => !currentTimezones.includes(tz.timezone));

            availableTimezones.forEach(tz => {
                const option = document.createElement('option');
                option.value = tz.timezone;
                option.textContent = tz.name;
                select.appendChild(option);
            });
        }

        // Initialize
        renderClocks();
        populateTimezoneSelect();

        // Update clocks every second
        setInterval(updateClocks, 1000);
    </script>
</body>
</html>
